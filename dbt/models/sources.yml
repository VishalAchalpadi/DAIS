# One source entry per ingest pipeline's stage table (Phase 9a). A gold
# build's dbt models reference upstream data via source(), e.g.
# {{ source('holdings_ingest', 'holdings_stage') }} - keeping the dbt-level
# dependency explicit and consistent with a gold_builds/*.yaml's
# depends_on field, rather than a bare cross-schema table reference.
#
# The table's declared name here is the SAME as its real identifier (no
# separate `identifier:` needed) - deliberately, not just for tidiness:
# openlineage-dbt's own source-node dataset naming (verified against its
# installed source) uses this declared name for the coarse, top-level
# dataset entry it emits, while a DIFFERENT code path inside the same tool
# (column-lineage) resolves through to the real identifier. Using a
# generic alias like "stage" for every pipeline would make that coarse
# name collide across pipelines AND mismatch lineage/emitter.py's own
# dataset identity for the same physical table (see
# lineage/emitter.py's db_namespace/dbname handling) - the unified,
# per-pipeline-specific name here keeps both paths pointing at the same
# dataset, so raw/stage lineage and gold's dbt-ol lineage connect into one
# graph in a real OpenLineage backend instead of two disconnected ones.
version: 2

sources:
  - name: holdings_ingest
    schema: data_in
    tables:
      - name: holdings_stage

  - name: asset_ingest
    schema: data_in
    tables:
      - name: asset_stage

  - name: price_ingest
    schema: data_in
    tables:
      - name: price_stage

  - name: benchmark_ingest
    schema: data_in
    tables:
      - name: benchmark_stage

  - name: sales_ingest
    schema: data_in
    tables:
      - name: sales_stage
